name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          package-manager-cache: false
      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check repository lint rules
        run: python -m ruff check .
      - name: Controller and integration tests
        run: python -B -m unittest discover -s plugins/ai-tdd/tests -v
      - name: Deterministic RED/GREEN and mutation demo
        run: python -B scripts/smoke_demo.py
      - name: Compare weak and contract-based tests against selected faults
        run: python -B scripts/test_strength_demo.py
      - name: Build public ZIP
        run: python -B scripts/build_zip.py
