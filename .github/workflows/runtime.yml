name: Native runtime and .NET

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_download:
        description: Verify the published pinned runtimes through the real anonymous downloader
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: win32-x64
          - os: macos-15
            platform: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.100
            10.0.301
      - name: Install pinned build tools
        if: inputs.release_download != true
        run: python -m pip install -r requirements-runtime-build.txt
      - name: Build native controller and license notices
        if: inputs.release_download != true
        run: python -B scripts/build_runtime.py
      - name: Verify native bundle without Python on PATH
        if: inputs.release_download != true
        shell: bash
        env:
          RUNTIME_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$RUNTIME_PLATFORM" = win32-x64 ]; then suffix=.exe; else suffix=; fi
          export AI_TDD_PACKAGED_EXECUTABLE="$PWD/dist/runtime/ai-tdd-controller-1.5.0-${RUNTIME_PLATFORM}${suffix}"
          python -B -m unittest discover -s plugins/ai-tdd/tests -p test_portable_runtime.py -v
      - name: Full native .NET workflow with Python absent from controller PATH
        if: inputs.release_download != true
        shell: bash
        env:
          RUNTIME_PLATFORM: ${{ matrix.platform }}
          DOTNET_DEMO_SDK: '10.0.301'
        run: |
          if [ "$RUNTIME_PLATFORM" = win32-x64 ]; then suffix=.exe; else suffix=; fi
          python -B scripts/dotnet_demo.py --packaged-executable "$PWD/dist/runtime/ai-tdd-controller-1.5.0-${RUNTIME_PLATFORM}${suffix}" --output "dist/runtime/dotnet-${RUNTIME_PLATFORM}.json"
      - name: Measure actual fresh doctor and nested hook processes
        if: inputs.release_download != true
        shell: bash
        env:
          RUNTIME_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$RUNTIME_PLATFORM" = win32-x64 ]; then suffix=.exe; else suffix=; fi
          python -B scripts/measure_runtime.py --packaged-executable "$PWD/dist/runtime/ai-tdd-controller-1.5.0-${RUNTIME_PLATFORM}${suffix}" --output "dist/runtime/runtime-timing-${RUNTIME_PLATFORM}.json"
      - name: Verify anonymous released-runtime bootstrap
        run: python -B scripts/check_runtime_download.py --project-count 70 --native-dotnet --output dist/runtime/bootstrap-${{ matrix.platform }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ matrix.platform }}
          path: dist/runtime/*
          if-no-files-found: error
          retention-days: 7

  dotnet:
    if: inputs.release_download != true
    name: .NET / ${{ matrix.os }} / SDK ${{ matrix.sdk }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        sdk: ['8.0.100', '10.0.301']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.100
            ${{ matrix.sdk }}
      - name: Native xUnit/NUnit failure classification and full DONE workflows
        env:
          DOTNET_DEMO_SDK: ${{ matrix.sdk }}
        run: python -B scripts/dotnet_demo.py --output dotnet-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-${{ matrix.os }}-${{ matrix.sdk }}
          path: dotnet-evidence.json
          if-no-files-found: error
          retention-days: 7
